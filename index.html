<head>
  <meta charset="UTF-8">

  <title>𝐙𝐢 𝐘𝐮𝐞 (子月)</title>
  <meta name="description" content="Profil 𝐙𝐢 𝐘𝐮𝐞 (子月)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a1a;
      color: #fff;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Blob gradasi bergerak di background */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.7;
      z-index: 0;
      animation: float 12s ease-in-out infinite;
    }
    .blob-1 {
      width: 320px; height: 320px;
      background: radial-gradient(circle, #7c3aed, #4c1d95);
      top: -80px; left: -80px;
      animation-delay: 0s;
    }
    .blob-2 {
      width: 380px; height: 380px;
      background: radial-gradient(circle, #06b6d4, #0891b2);
      bottom: -100px; right: -100px;
      animation-delay: 3s;
    }
    .blob-3 {
      width: 280px; height: 280px;
      background: radial-gradient(circle, #ec4899, #be185d);
      top: 40%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: 6s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.1); }
      66% { transform: translate(-30px, 40px) scale(0.95); }
    }

    /* Kartu liquid glass */
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      padding: 44px 28px;
      text-align: center;
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        inset 0 -1px 0 rgba(255, 255, 255, 0.05);
      overflow: hidden;
    }

    /* Pantulan cahaya melintas di kartu */
    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        115deg,
        transparent 30%,
        rgba(255, 255, 255, 0.12) 45%,
        rgba(255, 255, 255, 0.25) 50%,
        rgba(255, 255, 255, 0.12) 55%,
        transparent 70%
      );
      animation: shine 6s linear infinite;
      pointer-events: none;
    }

    @keyframes shine {
      0% { transform: translateX(-100%) translateY(-100%) rotate(0deg); }
      100% { transform: translateX(100%) translateY(100%) rotate(0deg); }
    }

    /* Avatar dengan ring gradient berputar */
    .avatar-wrap {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 22px;
    }
    .avatar-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #7c3aed, #06b6d4, #ec4899, #7c3aed);
      animation: spin 6s linear infinite;
      z-index: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .avatar {
      position: relative;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(10, 10, 26, 0.9);
      z-index: 1;
      display: block;
    }

    .name {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff, #c4b5fd);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .username {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 18px;
      font-weight: 500;
    }
    .bio {
      font-size: 14px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 28px;
      padding: 0 8px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }
    .link::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }
    .link:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 30px rgba(124, 58, 237, 0.4);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .link:hover::after {
      transform: translateX(100%);
    }
    .link:active { transform: translateY(-1px) scale(0.99); }

    .link svg { width: 18px; height: 18px; flex-shrink: 0; }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
    }

    @media (max-width: 380px) {
      .card { padding: 36px 22px; }
      .name { font-size: 22px; }
    }
  </style>
</head>
